name: ci
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-walnut.txt
      - run: npm ci
      - run: python -m pytest tests_py -q -p no:cacheprovider
      - run: npm test
        env:
          STITCH_PYTHON: python
      - run: npm run build
      - run: npm run smoke:api
      - run: npm run check:dashes
